# Place inside nginx's http {} context (e.g. /etc/nginx/sites-available/tripo3d).
# Verify certificate paths for tripo3d.lens4web.com on your server.
# Keep the Node port private. All public access goes through this server block.
limit_req_zone $binary_remote_addr zone=tripo3d:10m rate=10r/s;

server {
    listen 80;
    server_name tripo3d.lens4web.com;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name tripo3d.lens4web.com;
    ssl_certificate /etc/letsencrypt/live/tripo3d.lens4web.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tripo3d.lens4web.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Public workspace. Tripo keys are held in short-lived server memory sessions.
    client_max_body_size 21m;
    client_body_timeout 30s;
    # Signed download URLs are long. Do not include them or keys in access logs.
    access_log off;
    # Error logs may still contain a request URI; keep their default root/admin permissions.
    error_log /var/log/nginx/tripo3d-error.log warn;

    location / {
        limit_req zone=tripo3d burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Preserve the session cookie; Node ignores other browser cookies.
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 190s;
        proxy_buffering off;
    }
}
