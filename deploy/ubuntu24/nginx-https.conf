# DNS only in Cloudflare: the client connects directly to this nginx.
# This file belongs in /etc/nginx/sites-enabled/, included inside http {}.
limit_req_zone $binary_remote_addr zone=tripo3d_requests:1m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name tripo3d.lens4web.com;
    auth_basic off;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/tripo3d-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 308 https://tripo3d.lens4web.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tripo3d.lens4web.com;
    ssl_certificate /etc/letsencrypt/live/tripo3d.lens4web.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tripo3d.lens4web.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    auth_basic off;
    client_max_body_size 21m;
    client_body_timeout 30s;
    access_log off;
    error_log /var/log/nginx/tripo3d-error.log warn;

    location / {
        limit_req zone=tripo3d_requests burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_cache off;
        proxy_intercept_errors off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 190s;
        proxy_buffering off;
    }
}
