# First stage: HTTP challenge only, before the certificate exists.
# /etc/nginx/sites-enabled/* is included inside http {} on the target server.
server {
    listen 80;
    listen [::]:80;
    server_name tripo3d.lens4web.com;
    auth_basic off;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/tripo3d-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
